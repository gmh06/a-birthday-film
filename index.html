<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light">
  <meta name="theme-color" content="#eee8dc">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="description" content="一份给 CYZ 的生日礼物。">
  <title>生日快乐 · CYZ</title>

  <meta property="og:type" content="website">
  <meta property="og:site_name" content="For CYZ">
  <meta property="og:title" content="生日快乐 · CYZ">
  <meta property="og:description" content="有些话，不必等到合适的时机。七分半钟，慢慢说给你听。">
  <meta property="og:url" content="https://gmh06.github.io/a-birthday-film/">
  <meta property="og:image" content="https://gmh06.github.io/a-birthday-film/assets/poster.jpg">
  <meta property="og:image:width" content="1920">
  <meta property="og:image:height" content="1080">
  <meta property="og:image:alt" content="A birthday film for CYZ">
  <meta name="twitter:card" content="summary_large_image">

  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
  <link rel="preload" as="image" href="assets/poster.jpg" fetchpriority="high">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="grain" aria-hidden="true"></div>

  <main class="page">
    <header class="masthead reveal d1">
      <p class="eyebrow">A Birthday Film</p>
      <p class="issue">For CYZ <span class="dot">·</span> 2026</p>
    </header>

    <section class="intro">
      <p class="kicker reveal d2">致 CYZ</p>
      <h1 class="title reveal d3">生日快乐<span class="stop">.</span></h1>
      <p class="subtitle reveal d4">Happy birthday, CYZ.</p>

      <div class="rule reveal d4">
        <span class="seal" aria-hidden="true">CYZ</span>
      </div>

      <p class="lede reveal d5">
        有些话，不必等到合适的时机。<br>
        七分半钟，慢慢说给你听。
      </p>
    </section>

    <figure class="film reveal d6" id="film">
      <div class="frame" id="frame">
        <video
          class="player"
          id="player"
          poster="assets/poster.jpg"
          preload="metadata"
          playsinline
          webkit-playsinline
          aria-label="给 CYZ 的生日祝福影片"
        >
          <source src="video/cyz-720.mp4" type="video/mp4">
        </video>

        <button class="cover" id="cover" type="button" aria-label="播放影片">
          <img class="cover-image" src="assets/poster.jpg" alt="" draggable="false" fetchpriority="high">
          <span class="cover-shade" aria-hidden="true"></span>
          <span class="cover-play" aria-hidden="true">
            <svg viewBox="0 0 18 22" role="presentation">
              <path d="M1.5 1.6c0-1.2 1.3-1.9 2.3-1.3l12.4 8.7c.9.6.9 2 0 2.6L3.8 20.3c-1 .7-2.3 0-2.3-1.2V1.6z"/>
            </svg>
          </span>
          <span class="cover-hint">播放影片</span>
          <span class="cover-meta" aria-hidden="true">
            <span>07:27</span>
            <span>With sound</span>
          </span>
        </button>

        <div class="video-error" id="videoError" hidden>
          影片暂时无法播放。<a href="video/cyz-720.mp4">直接下载</a>
        </div>

        <div class="controls" id="controls">
          <div class="scrub" id="scrub">
            <div class="scrub-track" aria-hidden="true">
              <div class="scrub-buffer" id="buffer"></div>
              <div class="scrub-fill" id="fill"></div>
            </div>
            <span class="scrub-thumb" id="thumb" aria-hidden="true"></span>
            <input
              class="seek"
              id="seek"
              type="range"
              min="0"
              max="1000"
              step="1"
              value="0"
              aria-label="播放进度"
            >
          </div>

          <div class="control-row">
            <button class="ctl" id="playToggle" type="button" aria-label="暂停">
              <svg class="icon-pause" viewBox="0 0 16 16" aria-hidden="true">
                <rect x="3" y="2" width="3.4" height="12" rx="0.6"/>
                <rect x="9.6" y="2" width="3.4" height="12" rx="0.6"/>
              </svg>
              <svg class="icon-play" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M4 2.4c0-.9 1-1.4 1.7-.9l9 5.6c.7.4.7 1.4 0 1.8l-9 5.6c-.7.5-1.7 0-1.7-.9V2.4z"/>
              </svg>
            </button>

            <p class="time" aria-label="播放时间">
              <span id="current">00:00</span><span class="time-sep">/</span><span id="duration">07:27</span>
            </p>

            <span class="spacer" aria-hidden="true"></span>

            <button class="ctl" id="mute" type="button" aria-label="静音">
              <svg class="icon-volume" viewBox="0 0 18 16" aria-hidden="true">
                <path d="M1.5 5.6h2.7L8.4 2c.5-.4 1.2 0 1.2.6v10.8c0 .6-.7 1-1.2.6L4.2 10.4H1.5c-.6 0-1-.4-1-1V6.6c0-.6.4-1 1-1z"/>
                <path d="M12.1 5.3c.9.8 1.4 1.7 1.4 2.7s-.5 1.9-1.4 2.7" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
                <path d="M14.4 3c1.4 1.3 2.1 3 2.1 5s-.7 3.7-2.1 5" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
              <svg class="icon-muted" viewBox="0 0 18 16" aria-hidden="true">
                <path d="M1.5 5.6h2.7L8.4 2c.5-.4 1.2 0 1.2.6v10.8c0 .6-.7 1-1.2.6L4.2 10.4H1.5c-.6 0-1-.4-1-1V6.6c0-.6.4-1 1-1z"/>
                <path d="M12.2 5.8l4.6 4.4M16.8 5.8l-4.6 4.4" fill="none" stroke="currentColor" stroke-width="1.2" stroke-linecap="round"/>
              </svg>
            </button>

            <button class="ctl" id="fullscreen" type="button" aria-label="全屏">
              <svg class="icon-expand" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M2 6V2h4M10 2h4v4M14 10v4h-4M6 14H2v-4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/>
              </svg>
              <svg class="icon-collapse" viewBox="0 0 16 16" aria-hidden="true">
                <path d="M6 2v4H2M14 6h-4V2M10 14v-4h4M2 10h4v4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="square"/>
              </svg>
            </button>
          </div>
        </div>
      </div>

      <figcaption class="caption">
        <span>一部关于你的小电影</span>
        <span class="caption-right">07:27 <span class="dot">·</span> 2026</span>
      </figcaption>
    </figure>

    <section class="letter">
      <p class="letter-kicker">A Note</p>
      <p class="letter-body">
        生日快乐。<br>
        愿你新的一岁，仍有值得期待的事，<br>
        仍有可以随时打扰的人。
      </p>
      <p class="signature">— 大家</p>
    </section>

    <footer class="footer">
      <span>For CYZ, with care</span>
      <span>2026</span>
    </footer>
  </main>

  <script src="app.js"></script>
</body>
</html>
